[package]
name        = "piano-ui"
description = "egui editor for the Phonix Piano engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# The chain's description, to draw its settings. NOT `phonix-fx-ui`: the
# page is drawn with Piano's own widgets so it is one instrument, not an
# instrument with the sequencer's rack bolted on.
phonix-fx      = { workspace = true }
phonix-rt      = { workspace = true }
phonix-ui      = { workspace = true }
piano      = { workspace = true }
egui        = { workspace = true }
egui_extras = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# Native Save/Load dialogs. Optional so a headless snapshot test, or a host that
# owns preset I/O itself, drops the file-dialog and platform-dirs crates.
rfd         = { workspace = true, optional = true }
directories = { workspace = true, optional = true }

[dev-dependencies]
# The editor is judged by eye, so its tests render it: `snapshot` writes PNG
# baselines under tests/snapshots and diffs against them, through software
# Vulkan (lavapipe), no GPU required. Two behaviour tests in app.rs already
# expected this crate and could not compile without it.
egui_kittest = { workspace = true }

[features]
default      = ["disk-presets"]
disk-presets = ["dep:rfd", "dep:directories", "dep:wayland-sys"]

# `rfd` reaches wayland through `ashpd`, and without the `dlopen` feature that
# crate's build script demands libwayland-client's pkg-config file at COMPILE
# time, for a library this editor never calls directly. With it, wayland is
# loaded at run time if it is present and ignored if it is not.
#
# This arrives by accident through glutin. Asked for explicitly here, the
# repository builds on a machine with no wayland development headers, which
# includes the one it is built on.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"], optional = true }
