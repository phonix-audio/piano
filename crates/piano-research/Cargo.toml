[package]
name        = "piano-research"
description = "Measurement tools for the Piano engine: soundboard transfer function, DSP cost bench, dry note renders."
publish     = false
version.workspace = true
edition.workspace = true
license.workspace = true

# These need `hound` and `rustfft` as REAL dependencies, not dev-dependencies,
# because a [[bin]] target cannot see dev-dependencies. That is the second
# reason they live in their own crate rather than in `src/bin/` of the engine:
# putting them there would have put a WAV writer in the engine's dependency
# graph, and the engine's whole contract is that it has one dependency.
[dependencies]
libc = "0.2"
piano  = { workspace = true }
hound   = { workspace = true }
rustfft = { workspace = true }

[[bin]]
name = "board_tf"
path = "src/bin/board_tf.rs"

[[bin]]
name = "piano_bench"
path = "src/bin/piano_bench.rs"

[[bin]]
name = "engine_bench"
path = "src/bin/engine_bench.rs"

[[bin]]
name = "retire_ab"
path = "src/bin/retire_ab.rs"

[[bin]]
name = "ensemble_bench"
path = "src/bin/ensemble_bench.rs"
