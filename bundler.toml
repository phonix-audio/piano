# Cargo package name -> the display name a host shows, and the name of the
# bundle directory.
#
# "Phonix Piano" composes, with VENDOR, the preset directory Cubase's MediaBay
# indexes (`<presets>/Phonix Audio/Phonix Piano/`), and it is the bundle name a
# host resolves when it scans for the plugin. See COMPAT.md.
#
# The name repeats the vendor on purpose. "Piano" alone is the word every host
# lists a dozen times over, and a plugin nobody can pick out of that list by
# name is worse off than one that spends a little width saying whose it is.

[piano-plugin]
name = "Phonix Piano"
